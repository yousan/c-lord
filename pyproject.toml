[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c-lord"
version = "1.4.0"
description = "Connect Claude Code to Discord and GitHub — interactive chat, CI/CD automation, and workflow integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4,<3.0",
    "aiosqlite>=0.20,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
api = ["aiohttp>=3.9"]
table = [
    "matplotlib>=3.10.9",
]

[project.scripts]
c-lord = "c_lord.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["c_lord"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "aiohttp>=3.9",
    "pyright>=1.1.408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# E2E tests post to a real Discord channel via webhook and require a running
# bot + .env credentials. They are excluded by default. Run with:
#   uv run pytest -m e2e tests/e2e/
addopts = "-m 'not e2e and not live_llm'"
markers = [
    "e2e: requires live Discord bot + webhook (skipped without .env credentials)",
    "live_llm: calls real claude haiku CLI; set CLORD_TEST_LIVE_LLM=1 to enable",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# table_renderer.py uses matplotlib as an optional dependency (c-lord[table]).
# Exclude from strict type checking so CI passes without the optional install.
ignore = ["c_lord/discord_ui/table_renderer.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
