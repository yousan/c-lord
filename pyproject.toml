[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "c-lord"
dynamic = ["version"]
description = "Connect Claude Code to Discord and GitHub — interactive chat, CI/CD automation, and workflow integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4,<3.0",
    "aiosqlite>=0.20,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
api = ["aiohttp>=3.9"]
table = [
    "pillow>=10.0",
    "emoji>=2.0",
]

[project.scripts]
c-lord = "c_lord.cli:main"

# Version is derived from git tags (vX.Y.Z) by hatch-vcs — the single source
# of truth. No hardcoded version anywhere. Build writes c_lord/_version.py
# (gitignored); runtime reads it via importlib.metadata when there's no .git.
[tool.hatch.version]
source = "vcs"
# fallback_version keeps the build working on a tagless / shallow checkout
# (fresh clone before the first tag, or CI without fetched tags). When a vX.Y.Z
# tag IS reachable it always wins — the tag remains the single source of truth.
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "c_lord/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["c_lord"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "aiohttp>=3.9",
    "pyright>=1.1.408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# E2E tests post to a real Discord channel via webhook and require a running
# bot + .env credentials. They are excluded by default. Run with:
#   uv run pytest -m e2e tests/e2e/
addopts = "-m 'not e2e and not live_llm'"
markers = [
    "e2e: requires live Discord bot + webhook (skipped without .env credentials)",
    "live_llm: calls real claude haiku CLI; set CLORD_TEST_LIVE_LLM=1 to enable",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Generated at build time by hatch-vcs — not our source, don't lint/format it.
extend-exclude = ["c_lord/_version.py"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# These modules use Pillow + emoji as optional dependencies (c-lord[table]).
# Exclude from strict type checking so CI passes without the optional install.
# _version.py is generated by hatch-vcs at build time (absent on a fresh tree).
ignore = [
    "c_lord/discord_ui/table_renderer.py",
    "c_lord/discord_ui/pane_renderer.py",
    "c_lord/discord_ui/fonts.py",
    "c_lord/_version.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
